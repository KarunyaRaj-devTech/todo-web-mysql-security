# application.properties

spring.application.name=umasuraj-springboot-web-application-mysql-database

server.port=8081

# /src/main/resources/META-INF/resources/WEB-INF/jsp/
# sayHello.jsp
# /WEB-INF/jsp/login.jsp => View Resolver
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

logging.level.org.springframework=info
logging.level.in.umasuraj.springboot.web=debug

spring.mvc.format.date=yyyy-MM-dd

# JPA and Hibernate properties
spring.jpa.generate-ddl=true

# To delay the execution of data.sql before entities are processed
spring.jpa.defer-datasource-initialization=true 

#spring.datasource.initialization-mode=always
spring.sql.init.mode=always

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# MySQL database connection configuration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/db_todo
spring.datasource.username=DBusername
spring.datasource.password=DBpassword


logging.level.org.springframework.jdbc.datasource.init=DEBUG